[versions]
agp = "9.3.0"
# Muss der in AGP eingebetteten Kotlin-Version entsprechen (AGP 9: built-in Kotlin);
# gilt für alle Kotlin-Begleit-Plugins (Compose, Serialization).
kotlinPlugins = "2.2.20"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
# Ab Umsetzungsschritt 3 (Player) bzw. 4 (Mikrofonpfad):
media3 = "1.10.1"
oboe = "1.10.0"
# Ab Umsetzungsschritt 5 (Profile); 1.9.0 ist gegen Kotlin 2.2 gebaut,
# 1.10+ verlangt Kotlin 2.3 (nicht zur eingebetteten Version passend).
kotlinxSerialization = "1.9.0"
junit = "4.13.2"

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
oboe = { group = "com.google.oboe", name = "oboe", version.ref = "oboe" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlinPlugins" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlinPlugins" }
